<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="Optima, Palatino, serif">
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5 z" fill="#17323b"/></marker><marker id="a-rule" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5 z" fill="#9fb0b5"/></marker><marker id="a-quiet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5 z" fill="#6b7d83"/></marker><marker id="a-commit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5 z" fill="#0e6e58"/></marker><marker id="a-undo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5 z" fill="#8c2f22"/></marker></defs>
<rect width="880" height="400" fill="white"/>
<text x="24" y="28" font-size="13.5" text-anchor="start" fill="#17323b" font-weight="600">docker compose up, and seven containers</text>
<rect x="24" y="48" width="832" height="92" fill="#eef3f2" stroke="#17323b" stroke-width="1.1"/>
<text x="440.0" y="68" font-size="13" text-anchor="middle" fill="#17323b" font-weight="600">localstack</text>
<text x="440" y="92" font-size="12" text-anchor="middle" fill="#17323b">DynamoDB, EventBridge, SQS and IAM in one container</text>
<text x="440" y="112" font-size="10.5" text-anchor="middle" fill="#6b7d83">eight tables, one bus, three rules, five queues</text>
<text x="440" y="130" font-size="10.5" text-anchor="middle" fill="#6b7d83" font-style="italic">the only difference from AWS is one environment variable</text>
<rect x="24" y="176" width="152" height="50" fill="#ffffff" stroke="#0e6e58" stroke-width="1.5"/>
<text x="100.0" y="196" font-size="12.5" text-anchor="middle" fill="#0e6e58" font-weight="600">order</text>
<text x="100" y="212" font-size="10" text-anchor="middle" fill="#6b7d83">port 9280</text>
<line x1="100" y1="174" x2="100" y2="144" stroke="#9fb0b5" stroke-width="1.1" marker-start="url(#a-rule)" marker-end="url(#a-rule)"/>
<rect x="196" y="176" width="152" height="50" fill="#ffffff" stroke="#0e6e58" stroke-width="1.5"/>
<text x="272.0" y="196" font-size="12.5" text-anchor="middle" fill="#0e6e58" font-weight="600">workflow</text>
<text x="272" y="212" font-size="10" text-anchor="middle" fill="#6b7d83">port 9284</text>
<line x1="272" y1="174" x2="272" y2="144" stroke="#9fb0b5" stroke-width="1.1" marker-start="url(#a-rule)" marker-end="url(#a-rule)"/>
<rect x="368" y="176" width="152" height="50" fill="#ffffff" stroke="#17323b" stroke-width="1.1"/>
<text x="444.0" y="196" font-size="12.5" text-anchor="middle" fill="#17323b" font-weight="600">inventory</text>
<text x="444" y="212" font-size="10" text-anchor="middle" fill="#6b7d83">port 9281</text>
<line x1="444" y1="174" x2="444" y2="144" stroke="#9fb0b5" stroke-width="1.1" marker-start="url(#a-rule)" marker-end="url(#a-rule)"/>
<rect x="540" y="176" width="152" height="50" fill="#ffffff" stroke="#17323b" stroke-width="1.1"/>
<text x="616.0" y="196" font-size="12.5" text-anchor="middle" fill="#17323b" font-weight="600">payment</text>
<text x="616" y="212" font-size="10" text-anchor="middle" fill="#6b7d83">port 9282</text>
<line x1="616" y1="174" x2="616" y2="144" stroke="#9fb0b5" stroke-width="1.1" marker-start="url(#a-rule)" marker-end="url(#a-rule)"/>
<rect x="712" y="176" width="152" height="50" fill="#ffffff" stroke="#17323b" stroke-width="1.1"/>
<text x="788.0" y="196" font-size="12.5" text-anchor="middle" fill="#17323b" font-weight="600">notification</text>
<text x="788" y="212" font-size="10" text-anchor="middle" fill="#6b7d83">port 9283</text>
<line x1="788" y1="174" x2="788" y2="144" stroke="#9fb0b5" stroke-width="1.1" marker-start="url(#a-rule)" marker-end="url(#a-rule)"/>
<line x1="24" y1="258" x2="856" y2="258" stroke="#9fb0b5" stroke-width="0.9"/>
<text x="24" y="284" font-size="12.5" text-anchor="start" fill="#0e6e58" font-weight="600">What it shows</text>
<text x="24" y="306" font-size="11" text-anchor="start" fill="#17323b">checkout answers in about 150 ms, and keeps answering</text>
<text x="24" y="323" font-size="11" text-anchor="start" fill="#17323b">while the notification handler is stopped</text>
<text x="24" y="340" font-size="11" text-anchor="start" fill="#17323b">the order is the fold of its events, and the read model agrees</text>
<text x="24" y="357" font-size="11" text-anchor="start" fill="#17323b">a declined card runs the compensating state</text>
<line x1="440" y1="272" x2="440" y2="384" stroke="#9fb0b5" stroke-width="0.9"/>
<text x="464" y="284" font-size="12.5" text-anchor="start" fill="#8c2f22" font-weight="600">What it does not</text>
<text x="464" y="306" font-size="11" text-anchor="start" fill="#17323b">Step Functions itself: the same file is interpreted locally,</text>
<text x="464" y="323" font-size="11" text-anchor="start" fill="#17323b">so timeout behaviour is approximated</text>
<text x="464" y="340" font-size="11" text-anchor="start" fill="#17323b">no gateway, no authorizer, no IAM boundaries</text>
<text x="464" y="357" font-size="11" text-anchor="start" fill="#17323b">no load test; 150 ms is one request on an idle laptop</text>
</svg>
