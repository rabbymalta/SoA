<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1c1b1f"/></marker><marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#6b6a70"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#b45309"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#8a6d1f"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#4338ca"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#15635a"/></marker></defs>
<rect width="880" height="430" fill="white"/>
<rect x="0" y="0" width="880" height="430" rx="3" fill="#ffffff" stroke="#ffffff" stroke-width="0"/>
<text x="24" y="26" font-size="11" text-anchor="start" fill="#6b6a70" font-weight="bold">DOCKER COMPOSE UP --BUILD -D --WAIT   ·   SEVEN CONTAINERS</text>
<rect x="24" y="40" width="832" height="120" rx="3" fill="#f5f4f2" stroke="#4338ca" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="440" y="62" font-size="14" text-anchor="middle" fill="#4338ca" font-weight="bold">localstack  —  DynamoDB · EventBridge · SQS · IAM</text>
<text x="440" y="80" font-size="11" text-anchor="middle" fill="#6b6a70">the whole cloud in one container; the only difference from AWS is AWS_ENDPOINT_URL</text>
<rect x="60" y="96" width="168" height="48" rx="3" fill="#ffffff" stroke="#1c1b1f" stroke-width="1.0"/>
<text x="144" y="116" font-size="12.5" text-anchor="middle" fill="#1c1b1f" font-weight="bold">8 tables</text>
<text x="144" y="133" font-size="10.5" text-anchor="middle" fill="#6b6a70">one per service</text>
<rect x="256" y="96" width="168" height="48" rx="3" fill="#ffffff" stroke="#1c1b1f" stroke-width="1.0"/>
<text x="340" y="116" font-size="12.5" text-anchor="middle" fill="#1c1b1f" font-weight="bold">1 bus</text>
<text x="340" y="133" font-size="10.5" text-anchor="middle" fill="#6b6a70">maltashop-bus</text>
<rect x="452" y="96" width="168" height="48" rx="3" fill="#ffffff" stroke="#1c1b1f" stroke-width="1.0"/>
<text x="536" y="116" font-size="12.5" text-anchor="middle" fill="#1c1b1f" font-weight="bold">3 rules</text>
<text x="536" y="133" font-size="10.5" text-anchor="middle" fill="#6b6a70">one per consumer</text>
<rect x="648" y="96" width="168" height="48" rx="3" fill="#ffffff" stroke="#1c1b1f" stroke-width="1.0"/>
<text x="732" y="116" font-size="12.5" text-anchor="middle" fill="#1c1b1f" font-weight="bold">5 queues</text>
<text x="732" y="133" font-size="10.5" text-anchor="middle" fill="#6b6a70">plus a dead-letter</text>
<text x="24" y="192" font-size="11" text-anchor="start" fill="#6b6a70" font-weight="bold">FIVE HANDLER CONTAINERS, ONE IMAGE</text>
<rect x="24" y="204" width="152" height="56" rx="3" fill="#ffffff" stroke="#b45309" stroke-width="1.0"/>
<text x="100" y="226" font-size="12.5" text-anchor="middle" fill="#b45309" font-weight="bold">order</text>
<text x="100" y="243" font-size="10.5" text-anchor="middle" fill="#6b6a70">:9280  ·  Python 3.12</text>
<line x1="100" y1="202" x2="100" y2="162" stroke="#6b6a70" stroke-width="1.0" marker-start="url(#arrow-grey)" marker-end="url(#arrow-grey)"/>
<rect x="194" y="204" width="152" height="56" rx="3" fill="#ffffff" stroke="#b45309" stroke-width="1.0"/>
<text x="270" y="226" font-size="12.5" text-anchor="middle" fill="#b45309" font-weight="bold">workflow</text>
<text x="270" y="243" font-size="10.5" text-anchor="middle" fill="#6b6a70">:9284  ·  Python 3.12</text>
<line x1="270" y1="202" x2="270" y2="162" stroke="#6b6a70" stroke-width="1.0" marker-start="url(#arrow-grey)" marker-end="url(#arrow-grey)"/>
<rect x="364" y="204" width="152" height="56" rx="3" fill="#ffffff" stroke="#1c1b1f" stroke-width="1.0"/>
<text x="440" y="226" font-size="12.5" text-anchor="middle" fill="#1c1b1f" font-weight="bold">inventory</text>
<text x="440" y="243" font-size="10.5" text-anchor="middle" fill="#6b6a70">:9281  ·  Python 3.12</text>
<line x1="440" y1="202" x2="440" y2="162" stroke="#6b6a70" stroke-width="1.0" marker-start="url(#arrow-grey)" marker-end="url(#arrow-grey)"/>
<rect x="534" y="204" width="152" height="56" rx="3" fill="#ffffff" stroke="#1c1b1f" stroke-width="1.0"/>
<text x="610" y="226" font-size="12.5" text-anchor="middle" fill="#1c1b1f" font-weight="bold">payment</text>
<text x="610" y="243" font-size="10.5" text-anchor="middle" fill="#6b6a70">:9282  ·  Python 3.12</text>
<line x1="610" y1="202" x2="610" y2="162" stroke="#6b6a70" stroke-width="1.0" marker-start="url(#arrow-grey)" marker-end="url(#arrow-grey)"/>
<rect x="704" y="204" width="152" height="56" rx="3" fill="#ffffff" stroke="#1c1b1f" stroke-width="1.0"/>
<text x="780" y="226" font-size="12.5" text-anchor="middle" fill="#1c1b1f" font-weight="bold">notification</text>
<text x="780" y="243" font-size="10.5" text-anchor="middle" fill="#6b6a70">:9283  ·  Python 3.12</text>
<line x1="780" y1="202" x2="780" y2="162" stroke="#6b6a70" stroke-width="1.0" marker-start="url(#arrow-grey)" marker-end="url(#arrow-grey)"/>
<line x1="24" y1="282" x2="856" y2="282" stroke="#6b6a70" stroke-width="0.8"/>
<rect x="24" y="300" width="404" height="108" rx="3" fill="#ffffff" stroke="#15635a" stroke-width="1.2"/>
<text x="226" y="322" font-size="13" text-anchor="middle" fill="#15635a" font-weight="bold">what the prototype proves</text>
<text x="226" y="341" font-size="10.5" text-anchor="middle" fill="#1c1b1f">checkout answers in ~150 ms and keeps answering</text>
<text x="226" y="355" font-size="10.5" text-anchor="middle" fill="#1c1b1f">while the notification handler is stopped</text>
<text x="226" y="369" font-size="10.5" text-anchor="middle" fill="#1c1b1f">the order is the fold of its events, and the read</text>
<text x="226" y="383" font-size="10.5" text-anchor="middle" fill="#1c1b1f">model agrees with it</text>
<text x="226" y="397" font-size="10.5" text-anchor="middle" fill="#1c1b1f">a declined card runs the compensating state</text>
<rect x="452" y="300" width="404" height="108" rx="3" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/>
<text x="654" y="322" font-size="13" text-anchor="middle" fill="#b45309" font-weight="bold">what it does not prove</text>
<text x="654" y="341" font-size="10.5" text-anchor="middle" fill="#1c1b1f">Step Functions itself: the same ASL file is</text>
<text x="654" y="355" font-size="10.5" text-anchor="middle" fill="#1c1b1f">interpreted locally, so timeout and heartbeat</text>
<text x="654" y="369" font-size="10.5" text-anchor="middle" fill="#1c1b1f">behaviour is approximated</text>
<text x="654" y="383" font-size="10.5" text-anchor="middle" fill="#1c1b1f">no API Gateway, no authorizer, no IAM boundaries</text>
<text x="654" y="397" font-size="10.5" text-anchor="middle" fill="#1c1b1f">no load test: 150 ms is one request on a laptop</text>
</svg>
