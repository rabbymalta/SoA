<text x="270" y="63" font-size="13" text-anchor="middle" fill="#b45309" font-weight="bold">verify</text>
<text x="270" y="82" font-size="10.5" text-anchor="middle" fill="#1c1b1f">ruff · bandit</text>
<text x="270" y="96" font-size="10.5" text-anchor="middle" fill="#1c1b1f">unit + contract tests</text>
<text x="270" y="110" font-size="10.5" text-anchor="middle" fill="#1c1b1f">states language parsed</text>
