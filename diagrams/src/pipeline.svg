<text x="24" y="192" font-size="11" text-anchor="start" fill="#6b6a70" font-weight="bold">RELEASE — A CANARY ON THE LIVE ALIAS, WATCHED BY ALARMS</text>
<rect x="24" y="204" width="832" height="150" rx="3" fill="#f5f4f2" stroke="#1c1b1f" stroke-width="1.0"/>
<rect x="48" y="228" width="180" height="54" rx="3" fill="#ffffff" stroke="#1c1b1f" stroke-width="1.0"/>
<text x="138" y="249" font-size="12.5" text-anchor="middle" fill="#1c1b1f" font-weight="bold">version N</text>
<text x="138" y="266" font-size="10.5" text-anchor="middle" fill="#6b6a70">90% of invocations</text>
<rect x="48" y="292" width="180" height="46" rx="3" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/>
<text x="138" y="311" font-size="12.5" text-anchor="middle" fill="#b45309" font-weight="bold">version N+1</text>
<text x="138" y="328" font-size="10.5" text-anchor="middle" fill="#6b6a70">10%, for five minutes</text>
<text x="138" y="220" font-size="11" text-anchor="middle" fill="#6b6a70" font-style="italic">live alias</text>
<line x1="232" y1="262" x2="268" y2="262" stroke="#6b6a70" stroke-width="1.0" marker-end="url(#arrow-grey)"/>
<line x1="232" y1="314" x2="268" y2="314" stroke="#b45309" stroke-width="1.0" marker-end="url(#arrow-accent)"/>
<rect x="272" y="228" width="232" height="110" rx="3" fill="#ffffff" stroke="#1c1b1f" stroke-width="1.0"/>
<text x="388" y="250" font-size="12.5" text-anchor="middle" fill="#1c1b1f" font-weight="bold">three CloudWatch alarms</text>
<text x="388" y="269" font-size="11" text-anchor="middle" fill="#1c1b1f">checkout 5xx rate</text>
<text x="388" y="285" font-size="11" text-anchor="middle" fill="#1c1b1f">checkout p99 latency</text>
<text x="388" y="301" font-size="11" text-anchor="middle" fill="#1c1b1f">failed workflow executions</text>
<text x="388" y="326" font-size="10.5" text-anchor="middle" fill="#b45309" font-style="italic">any one fires → reverse</text>
<line x1="508" y1="262" x2="544" y2="262" stroke="#6b6a70" stroke-width="1.0" marker-end="url(#arrow-grey)"/>
<rect x="548" y="228" width="136" height="48" rx="3" fill="#e7f2f0" stroke="#15635a" stroke-width="1.2"/>
<text x="616" y="250" font-size="12.5" text-anchor="middle" fill="#15635a" font-weight="bold">promote</text>
<text x="616" y="266" font-size="10.5" text-anchor="middle" fill="#6b6a70">100% to N+1</text>
<line x1="508" y1="314" x2="544" y2="314" stroke="#b45309" stroke-width="1.0" marker-end="url(#arrow-accent)"/>
<rect x="548" y="290" width="136" height="48" rx="3" fill="#fdf1e3" stroke="#b45309" stroke-width="1.2"/>
<text x="616" y="312" font-size="12.5" text-anchor="middle" fill="#b45309" font-weight="bold">roll back</text>
<text x="616" y="328" font-size="10.5" text-anchor="middle" fill="#6b6a70">alias to N, seconds</text>
<rect x="700" y="228" width="136" height="110" rx="3" fill="#ffffff" stroke="#1c1b1f" stroke-width="1.0"/>
<text x="768" y="250" font-size="12.5" text-anchor="middle" fill="#1c1b1f" font-weight="bold">hooks</text>
<text x="768" y="269" font-size="10" text-anchor="middle" fill="#1c1b1f">pre-traffic: a synthetic</text>
<text x="768" y="283" font-size="10" text-anchor="middle" fill="#1c1b1f">order on N+1</text>
<text x="768" y="297" font-size="10" text-anchor="middle" fill="#1c1b1f">post-traffic: the saga</text>
<text x="768" y="311" font-size="10" text-anchor="middle" fill="#1c1b1f">completed</text>
<line x1="24" y1="372" x2="856" y2="372" stroke="#6b6a70" stroke-width="0.8"/>
<text x="440" y="396" font-size="11.5" text-anchor="middle" fill="#6b6a70" font-style="italic">Continuous deployment: no approval gate anywhere, because the alarms are a better judge than a person at 18:00 on a Friday.</text>
<text x="440" y="418" font-size="11.5" text-anchor="middle" fill="#6b6a70" font-style="italic">Trunk-based development; a branch that lives longer than a day is a review comment.</text>
<text x="440" y="446" font-size="12" text-anchor="middle" fill="#1c1b1f" font-weight="bold">Deployment frequency 17/year → 20/week   ·   lead time 23 days → under 2 hours</text>
</svg>
