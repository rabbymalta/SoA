<text x="440" y="82" font-size="10.5" text-anchor="middle" fill="#1c1b1f">one bundle</text>
<text x="440" y="96" font-size="10.5" text-anchor="middle" fill="#1c1b1f">SHA-256 recorded</text>
<text x="440" y="110" font-size="10.5" text-anchor="middle" fill="#1c1b1f">nothing rebuilt later</text>
