<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="Optima, Palatino, serif">
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5 z" fill="#17323b"/></marker><marker id="a-rule" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5 z" fill="#9fb0b5"/></marker><marker id="a-quiet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5 z" fill="#6b7d83"/></marker><marker id="a-commit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5 z" fill="#0e6e58"/></marker><marker id="a-undo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5 z" fill="#8c2f22"/></marker></defs>
<rect width="880" height="470" fill="white"/>
<text x="24" y="30" font-size="13" text-anchor="start" fill="#17323b" font-weight="600">git push</text>
<line x1="24" y1="40" x2="24" y2="58" stroke="#9fb0b5" stroke-width="1.1" marker-end="url(#a-rule)"/>
<rect x="24" y="58" width="188" height="74" fill="#ffffff" stroke="#17323b" stroke-width="1.1"/>
<text x="118.0" y="78" font-size="13" text-anchor="middle" fill="#17323b" font-weight="600">verify</text>
<text x="118.0" y="96" font-size="11" text-anchor="middle" fill="#6b7d83">ruff, bandit</text>
<text x="118.0" y="111" font-size="11" text-anchor="middle" fill="#6b7d83">unit and contract tests</text>
<rect x="236" y="58" width="188" height="74" fill="#ffffff" stroke="#17323b" stroke-width="1.1"/>
<text x="330.0" y="78" font-size="13" text-anchor="middle" fill="#17323b" font-weight="600">build once</text>
<text x="330.0" y="96" font-size="11" text-anchor="middle" fill="#6b7d83">one bundle</text>
<text x="330.0" y="111" font-size="11" text-anchor="middle" fill="#6b7d83">its digest recorded</text>
<line x1="216" y1="95" x2="232" y2="95" stroke="#17323b" stroke-width="1.1" marker-end="url(#a-ink)"/>
<rect x="448" y="58" width="188" height="74" fill="#ffffff" stroke="#17323b" stroke-width="1.1"/>
<text x="542.0" y="78" font-size="13" text-anchor="middle" fill="#17323b" font-weight="600">integration</text>
<text x="542.0" y="96" font-size="11" text-anchor="middle" fill="#6b7d83">compose up</text>
<text x="542.0" y="111" font-size="11" text-anchor="middle" fill="#6b7d83">both failure paths</text>
<line x1="428" y1="95" x2="444" y2="95" stroke="#17323b" stroke-width="1.1" marker-end="url(#a-ink)"/>
<rect x="660" y="58" width="188" height="74" fill="#ffffff" stroke="#17323b" stroke-width="1.1"/>
<text x="754.0" y="78" font-size="13" text-anchor="middle" fill="#17323b" font-weight="600">deploy</text>
<text x="754.0" y="96" font-size="11" text-anchor="middle" fill="#6b7d83">the recorded bundle,</text>
<text x="754.0" y="111" font-size="11" text-anchor="middle" fill="#6b7d83">never a rebuild</text>
<line x1="640" y1="95" x2="656" y2="95" stroke="#17323b" stroke-width="1.1" marker-end="url(#a-ink)"/>
<text x="24" y="158" font-size="11.5" text-anchor="start" fill="#6b7d83" font-style="italic">No approval gate anywhere. What replaces it is drawn below.</text>
<line x1="24" y1="180" x2="856" y2="180" stroke="#9fb0b5" stroke-width="0.9"/>
<text x="24" y="206" font-size="13.5" text-anchor="start" fill="#17323b" font-weight="600">The release: ten per cent of invocations, for five minutes</text>
<text x="24" y="240" font-size="11" text-anchor="start" fill="#6b7d83">live alias</text>
<rect x="24" y="250" width="396" height="34" fill="#eef3f2" stroke="#9fb0b5" stroke-width="0.9"/>
<rect x="24" y="250" width="356" height="34" fill="#ffffff" stroke="#17323b" stroke-width="1.1"/>
<text x="202" y="272" font-size="12.5" text-anchor="middle" fill="#17323b">version N, taking 90 per cent</text>
<rect x="380" y="250" width="40" height="34" fill="#0e6e58"/>
<text x="400" y="272" font-size="10.5" text-anchor="middle" fill="#ffffff" font-weight="600">N+1</text>
<text x="400" y="300" font-size="10.5" text-anchor="middle" fill="#0e6e58" font-weight="600">10%</text>
<line x1="424" y1="267" x2="452" y2="267" stroke="#17323b" stroke-width="1.1" marker-end="url(#a-ink)"/>
<rect x="456" y="232" width="182" height="70" fill="#ffffff" stroke="#17323b" stroke-width="1.1"/>
<text x="547.0" y="252" font-size="13" text-anchor="middle" fill="#17323b" font-weight="600">three alarms</text>
<text x="547.0" y="270" font-size="11" text-anchor="middle" fill="#6b7d83">checkout 5xx rate</text>
<text x="547.0" y="285" font-size="11" text-anchor="middle" fill="#6b7d83">checkout p99</text>
<text x="547.0" y="300" font-size="11" text-anchor="middle" fill="#6b7d83">failed executions</text>
<line x1="638" y1="250" x2="666" y2="250" stroke="#0e6e58" stroke-width="1.1" marker-end="url(#a-commit)"/>
<rect x="670" y="228" width="186" height="40" fill="#ffffff" stroke="#0e6e58" stroke-width="1.5"/>
<text x="763.0" y="248" font-size="13" text-anchor="middle" fill="#0e6e58" font-weight="600">promote to 100%</text>
<line x1="638" y1="284" x2="666" y2="284" stroke="#8c2f22" stroke-width="1.1" marker-end="url(#a-undo)"/>
<rect x="670" y="274" width="186" height="40" fill="#ffffff" stroke="#8c2f22" stroke-width="1.5"/>
<text x="763.0" y="294" font-size="13" text-anchor="middle" fill="#8c2f22" font-weight="600">reset the alias</text>
<text x="856" y="330" font-size="10.5" text-anchor="end" fill="#8c2f22">any one alarm reverses the shift in seconds</text>
<line x1="24" y1="364" x2="856" y2="364" stroke="#9fb0b5" stroke-width="0.9"/>
<text x="24" y="390" font-size="11.5" text-anchor="start" fill="#6b7d83">Trunk-based development: a branch that outlives a day is a review comment.</text>
<text x="24" y="410" font-size="11.5" text-anchor="start" fill="#6b7d83">Lead time 23 days to under 2 hours. Deployment frequency 17 a year to 20 a week.</text>
<text x="24" y="442" font-size="11.5" text-anchor="start" fill="#17323b" font-style="italic">The bundle built in stage two is the only artefact any later stage deploys.</text>
</svg>
