<text x="440" y="162" font-size="10.5" text-anchor="middle" fill="#6b6a70">redacts names, addresses and anything card-shaped before it leaves the account</text>
<rect x="200" y="188" width="480" height="54" rx="3" fill="#fbf4e6" stroke="#8a6d1f" stroke-width="1.6"/>
<text x="440" y="210" font-size="14" text-anchor="middle" fill="#8a6d1f" font-weight="bold">Honeycomb</text>
<text x="440" y="228" font-size="10.5" text-anchor="middle" fill="#6b6a70">one wide event per span: correlation_id, order_id, customer_id, sku, workflow_state, cold_start</text>
<line x1="440" y1="170" x2="440" y2="186" stroke="#6b6a70" stroke-width="1.0" marker-end="url(#arrow-grey)"/>
<rect x="700" y="124" width="156" height="118" rx="3" fill="#ffffff" stroke="#6b6a70" stroke-width="1.0" stroke-dasharray="6 4"/>
<text x="778" y="146" font-size="12.5" text-anchor="middle" fill="#6b6a70" font-weight="bold">CloudWatch</text>
<text x="778" y="165" font-size="10" text-anchor="middle" fill="#1c1b1f">infrastructure metrics</text>
<text x="778" y="179" font-size="10" text-anchor="middle" fill="#1c1b1f">and the three alarms</text>
<text x="778" y="193" font-size="10" text-anchor="middle" fill="#1c1b1f">the canary reads</text>
<text x="778" y="207" font-size="10" text-anchor="middle" fill="#1c1b1f">(Figure 2)</text>
<line x1="24" y1="262" x2="856" y2="262" stroke="#6b6a70" stroke-width="0.8"/>
<text x="24" y="286" font-size="11" text-anchor="start" fill="#6b6a70" font-weight="bold">OBJECTIVE AND ALERTS</text>
<rect x="24" y="298" width="404" height="130" rx="3" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/>
<text x="226" y="320" font-size="13.5" text-anchor="middle" fill="#b45309" font-weight="bold">SLO: checkout</text>
<text x="226" y="339" font-size="11" text-anchor="middle" fill="#1c1b1f">99.95% of POST /orders answer 2xx in ≤ 750 ms,</text>
<text x="226" y="355" font-size="11" text-anchor="middle" fill="#1c1b1f">measured over a rolling 7 days</text>
<text x="226" y="371" font-size="11" text-anchor="middle" fill="#1c1b1f">error budget: 5 min 2 s a week</text>
<line x1="40" y1="392" x2="412" y2="392" stroke="#b45309" stroke-width="0.8" stroke-dasharray="6 4"/>
<text x="226" y="408" font-size="10.5" text-anchor="middle" fill="#1c1b1f">burn 14.4× over 5 min → page the on-call engineer</text>
<text x="226" y="423" font-size="10.5" text-anchor="middle" fill="#1c1b1f">burn 6× over 1 h → Slack, same working day</text>
<rect x="452" y="298" width="404" height="130" rx="3" fill="#ffffff" stroke="#1c1b1f" stroke-width="1.0"/>
<text x="654" y="320" font-size="13.5" text-anchor="middle" fill="#1c1b1f" font-weight="bold">the March incident, on this design</text>
<text x="654" y="339" font-size="10.5" text-anchor="middle" fill="#1c1b1f">1  the e-mail handler leaks; its concurrency climbs</text>
<text x="654" y="354" font-size="10.5" text-anchor="middle" fill="#1c1b1f">2  checkout is untouched — a different function</text>
<text x="654" y="369" font-size="10.5" text-anchor="middle" fill="#1c1b1f">3  one query groups errors by function and version</text>
<text x="654" y="384" font-size="10.5" text-anchor="middle" fill="#1c1b1f">4  the unsent messages are still on the queue</text>
<text x="654" y="399" font-size="10.5" text-anchor="middle" fill="#1c1b1f">5  fifty minutes of lost sales becomes a ticket</text>
</svg>
