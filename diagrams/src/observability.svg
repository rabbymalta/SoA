<svg xmlns="http://www.w3.org/2000/svg" width="880" height="452" viewBox="0 0 880 452" font-family="Optima, Palatino, serif">
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5 z" fill="#17323b"/></marker><marker id="a-rule" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5 z" fill="#9fb0b5"/></marker><marker id="a-quiet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5 z" fill="#6b7d83"/></marker><marker id="a-commit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5 z" fill="#0e6e58"/></marker><marker id="a-undo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5 z" fill="#8c2f22"/></marker></defs>
<rect width="880" height="452" fill="white"/>
<text x="70" y="30" font-size="12.5" text-anchor="middle" fill="#17323b" font-weight="600">place-order</text>
<line x1="70" y1="40" x2="440" y2="92" stroke="#9fb0b5" stroke-width="1.1" marker-end="url(#a-rule)"/>
<text x="242" y="30" font-size="12.5" text-anchor="middle" fill="#17323b" font-weight="600">workflow</text>
<line x1="242" y1="40" x2="440" y2="92" stroke="#9fb0b5" stroke-width="1.1" marker-end="url(#a-rule)"/>
<text x="414" y="30" font-size="12.5" text-anchor="middle" fill="#17323b" font-weight="600">inventory</text>
<line x1="414" y1="40" x2="440" y2="92" stroke="#9fb0b5" stroke-width="1.1" marker-end="url(#a-rule)"/>
<text x="586" y="30" font-size="12.5" text-anchor="middle" fill="#17323b" font-weight="600">payment</text>
<line x1="586" y1="40" x2="440" y2="92" stroke="#9fb0b5" stroke-width="1.1" marker-end="url(#a-rule)"/>
<text x="758" y="30" font-size="12.5" text-anchor="middle" fill="#17323b" font-weight="600">notification</text>
<line x1="758" y1="40" x2="440" y2="92" stroke="#9fb0b5" stroke-width="1.1" marker-end="url(#a-rule)"/>
<text x="24" y="76" font-size="10.5" text-anchor="start" fill="#6b7d83" font-style="italic">every handler, instrumented with OpenTelemetry</text>
<rect x="252" y="96" width="376" height="44" fill="#ffffff" stroke="#17323b" stroke-width="1.1"/>
<text x="440.0" y="116" font-size="13" text-anchor="middle" fill="#17323b" font-weight="600">Collector</text>
<text x="440" y="128" font-size="10.5" text-anchor="middle" fill="#6b7d83">redacts anything personal before it leaves the account</text>
<line x1="440" y1="140" x2="440" y2="164" stroke="#17323b" stroke-width="1.1" marker-end="url(#a-ink)"/>
<rect x="252" y="168" width="376" height="50" fill="#ffffff" stroke="#17323b" stroke-width="1.1"/>
<text x="440.0" y="188" font-size="13" text-anchor="middle" fill="#17323b" font-weight="600">Honeycomb</text>
<text x="440" y="204" font-size="10.5" text-anchor="middle" fill="#6b7d83">one wide event per span: order, customer, sku, workflow state</text>
<rect x="672" y="96" width="184" height="122" fill="#eef3f2" stroke="#17323b" stroke-width="1.1"/>
<text x="764.0" y="116" font-size="13" text-anchor="middle" fill="#17323b" font-weight="600">CloudWatch</text>
<text x="764.0" y="134" font-size="11" text-anchor="middle" fill="#6b7d83">infrastructure metrics,</text>
<text x="764.0" y="149" font-size="11" text-anchor="middle" fill="#6b7d83">and the three alarms</text>
<text x="764.0" y="164" font-size="11" text-anchor="middle" fill="#6b7d83">the release reads</text>
<line x1="24" y1="254" x2="856" y2="254" stroke="#9fb0b5" stroke-width="0.9"/>
<text x="24" y="282" font-size="13.5" text-anchor="start" fill="#17323b" font-weight="600">One week of checkout, and the budget inside it</text>
<text x="24" y="306" font-size="11" text-anchor="start" fill="#6b7d83">99.95% answering in 750 ms or less, measured over seven days</text>
<rect x="24" y="318" width="520" height="26" fill="#eef3f2" stroke="#9fb0b5" stroke-width="0.8"/>
<rect x="24" y="318" width="10.4" height="26" fill="#8c2f22"/>
<text x="24" y="362" font-size="10.5" text-anchor="start" fill="#6b7d83">the whole week</text>
<text x="568" y="330" font-size="12" text-anchor="start" fill="#8c2f22" font-weight="600">5 min 2 s of budget</text>
<text x="568" y="348" font-size="10" text-anchor="start" fill="#6b7d83" font-style="italic">drawn forty times its true width, or it would be invisible</text>
<line x1="24" y1="388" x2="856" y2="388" stroke="#9fb0b5" stroke-width="0.9"/>
<text x="24" y="412" font-size="11.5" text-anchor="start" fill="#17323b">Burning it 14.4 times too fast for five minutes pages the on-call engineer.</text>
<text x="24" y="432" font-size="11.5" text-anchor="start" fill="#17323b">Six times too fast for an hour reaches Slack, to be answered the same working day.</text>
</svg>
