<polyline points="648,318 648,360 300,360 300,390" fill="none" stroke="#4338ca" stroke-width="1.2" marker-end="url(#arrow-blue)"/>
<text x="190" y="470" font-size="11" text-anchor="start" fill="#6b6a70" font-weight="bold">READ SIDE AND SUBSCRIBERS — EACH ONE A RULE AND A QUEUE</text>
<rect x="24" y="482" width="196" height="78" rx="3" fill="#ffffff" stroke="#1c1b1f" stroke-width="1.0"/>
<text x="122" y="503" font-size="13" text-anchor="middle" fill="#1c1b1f" font-weight="bold">Projector</text>
<text x="122" y="522" font-size="11" text-anchor="middle" fill="#1c1b1f">folds the stream into</text>
<text x="122" y="536" font-size="11" text-anchor="middle" fill="#1c1b1f">the order read model</text>
<line x1="122" y1="440" x2="122" y2="480" stroke="#4338ca" stroke-width="1.0" marker-end="url(#arrow-blue)"/>
<rect x="236" y="482" width="196" height="78" rx="3" fill="#ffffff" stroke="#1c1b1f" stroke-width="1.0"/>
<text x="334" y="503" font-size="13" text-anchor="middle" fill="#1c1b1f" font-weight="bold">Notification</text>
<text x="334" y="522" font-size="11" text-anchor="middle" fill="#1c1b1f">e-mail and SMS;</text>
<text x="334" y="536" font-size="11" text-anchor="middle" fill="#1c1b1f">nothing waits for it</text>
<line x1="334" y1="440" x2="334" y2="480" stroke="#4338ca" stroke-width="1.0" marker-end="url(#arrow-blue)"/>
<rect x="448" y="482" width="196" height="78" rx="3" fill="#e7f2f0" stroke="#15635a" stroke-width="1.0"/>
<text x="546" y="503" font-size="13" text-anchor="middle" fill="#15635a" font-weight="bold">Recommendation</text>
<text x="546" y="522" font-size="11" text-anchor="middle" fill="#1c1b1f">Python model; reads the</text>
<text x="546" y="536" font-size="11" text-anchor="middle" fill="#1c1b1f">same stream, never the till</text>
<line x1="546" y1="440" x2="546" y2="480" stroke="#4338ca" stroke-width="1.0" marker-end="url(#arrow-blue)"/>
<rect x="660" y="482" width="196" height="78" rx="3" fill="#f5f4f2" stroke="#1c1b1f" stroke-width="1.0"/>
<text x="758" y="503" font-size="13" text-anchor="middle" fill="#1c1b1f" font-weight="bold">Partner feed</text>
<text x="758" y="522" font-size="11" text-anchor="middle" fill="#1c1b1f">one queue per retailer,</text>
<text x="758" y="536" font-size="11" text-anchor="middle" fill="#1c1b1f">added without a release</text>
<line x1="758" y1="440" x2="758" y2="480" stroke="#4338ca" stroke-width="1.0" marker-end="url(#arrow-blue)"/>
<line x1="24" y1="578" x2="856" y2="578" stroke="#6b6a70" stroke-width="0.8"/>
<text x="440" y="597" font-size="11" text-anchor="middle" fill="#6b6a70" font-style="italic">Nothing above is a server: every box is a Lambda function, a managed service or a DynamoDB table, and the</text>
<text x="440" y="605" font-size="11" text-anchor="middle" fill="#6b6a70" font-style="italic">platform scales each of them on its own. Plain arrow = synchronous · double arrow = task token · line from the bus = a rule.</text>
</svg>
