<text x="190" y="382" font-size="11" text-anchor="start" fill="#6b6a70" font-weight="bold">INTEGRATION — ONE BUS, ONE RULE PER CONSUMER</text>
<rect x="24" y="392" width="832" height="48" rx="3" fill="#eeedfb" stroke="#4338ca" stroke-width="1.6"/>
<text x="440" y="414" font-size="14.5" text-anchor="middle" fill="#4338ca" font-weight="bold">Amazon EventBridge — maltashop-bus</text>
<text x="440" y="431" font-size="10.5" text-anchor="middle" fill="#6b6a70">OrderPlaced · StockReserved · StockRejected · PaymentAuthorised · PaymentDeclined · OrderConfirmed · OrderCancelled</text>
