<text x="180" y="169" font-size="11" text-anchor="middle" fill="#6b6a70">TLS · throttling · request validation</text>
<line x1="336" y1="130" x2="336" y2="180" stroke="#6b6a70" stroke-width="0.8"/>
<text x="496" y="152" font-size="14" text-anchor="middle" fill="#1c1b1f" font-weight="bold">Lambda authorizer</text>
