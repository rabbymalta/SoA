<svg xmlns="http://www.w3.org/2000/svg" width="880" height="600" viewBox="0 0 880 600" font-family="Optima, Palatino, serif">
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5 z" fill="#17323b"/></marker><marker id="a-rule" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5 z" fill="#9fb0b5"/></marker><marker id="a-quiet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5 z" fill="#6b7d83"/></marker><marker id="a-commit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5 z" fill="#0e6e58"/></marker><marker id="a-undo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5 z" fill="#8c2f22"/></marker></defs>
<rect width="880" height="600" fill="white"/>
<text x="92" y="26" font-size="13" text-anchor="middle" fill="#17323b" font-weight="600">Web storefront</text>
<text x="92" y="42" font-size="10.5" text-anchor="middle" fill="#6b7d83">customers</text>
<line x1="92" y1="52" x2="92" y2="76" stroke="#9fb0b5" stroke-width="1.1" marker-end="url(#a-rule)"/>
<text x="292" y="26" font-size="13" text-anchor="middle" fill="#17323b" font-weight="600">Mobile app</text>
<text x="292" y="42" font-size="10.5" text-anchor="middle" fill="#6b7d83">customers</text>
<line x1="292" y1="52" x2="292" y2="76" stroke="#9fb0b5" stroke-width="1.1" marker-end="url(#a-rule)"/>
<text x="492" y="26" font-size="13" text-anchor="middle" fill="#17323b" font-weight="600">Partner API</text>
<text x="492" y="42" font-size="10.5" text-anchor="middle" fill="#6b7d83">30 retailers</text>
<line x1="492" y1="52" x2="492" y2="76" stroke="#9fb0b5" stroke-width="1.1" marker-end="url(#a-rule)"/>
<rect x="24" y="80" width="560" height="46" fill="#ffffff" stroke="#17323b" stroke-width="1.1"/>
<text x="304.0" y="100" font-size="13" text-anchor="middle" fill="#17323b" font-weight="600"></text>
<text x="44" y="101" font-size="13" text-anchor="start" fill="#17323b" font-weight="600">API Gateway</text>
<text x="44" y="117" font-size="10.5" text-anchor="start" fill="#6b7d83">throttling and request validation</text>
<line x1="246" y1="80" x2="246" y2="126" stroke="#9fb0b5" stroke-width="0.9"/>
<text x="266" y="101" font-size="13" text-anchor="start" fill="#17323b" font-weight="600">Lambda authorizer</text>
<text x="266" y="117" font-size="10.5" text-anchor="start" fill="#6b7d83">customer tokens, one API key per retailer</text>
<text x="24" y="168" font-size="12.5" text-anchor="start" fill="#0e6e58" font-weight="600">The one synchronous step</text>
<rect x="24" y="180" width="170" height="76" fill="#ffffff" stroke="#0e6e58" stroke-width="1.5"/>
<text x="109.0" y="200" font-size="13" text-anchor="middle" fill="#0e6e58" font-weight="600">place-order</text>
<text x="109.0" y="218" font-size="11" text-anchor="middle" fill="#6b7d83">appends OrderPlaced,</text>
<text x="109.0" y="233" font-size="11" text-anchor="middle" fill="#6b7d83">answers 201</text>
<path d="M36,235.5 v7 a5,3.5 0 0 0 10,0 v-7" fill="none" stroke="#0e6e58" stroke-width="1"/>
<ellipse cx="41" cy="235.5" rx="5" ry="3.5" fill="none" stroke="#0e6e58" stroke-width="1"/>
<text x="50" y="243" font-size="10.5" text-anchor="start" fill="#6b7d83">order-events</text>
<line x1="194" y1="218" x2="230" y2="218" stroke="#0e6e58" stroke-width="1.1" marker-end="url(#a-commit)"/>
<rect x="230" y="180" width="160" height="76" fill="#ffffff" stroke="#0e6e58" stroke-width="1.5"/>
<text x="310.0" y="200" font-size="13" text-anchor="middle" fill="#0e6e58" font-weight="600">workflow</text>
<text x="310.0" y="218" font-size="11" text-anchor="middle" fill="#6b7d83">the saga, declared;</text>
<text x="310.0" y="233" font-size="11" text-anchor="middle" fill="#6b7d83">holds the sequence</text>
<line x1="390" y1="204" x2="426" y2="204" stroke="#0e6e58" stroke-width="1.1" marker-end="url(#a-commit)"/>
<rect x="426" y="180" width="148" height="76" fill="#ffffff" stroke="#17323b" stroke-width="1.1"/>
<text x="500.0" y="200" font-size="13" text-anchor="middle" fill="#17323b" font-weight="600">inventory</text>
<text x="500.0" y="218" font-size="11" text-anchor="middle" fill="#6b7d83">holds stock</text>
<path d="M438,235.5 v7 a5,3.5 0 0 0 10,0 v-7" fill="none" stroke="#17323b" stroke-width="1"/>
<ellipse cx="443" cy="235.5" rx="5" ry="3.5" fill="none" stroke="#17323b" stroke-width="1"/>
<text x="452" y="243" font-size="10.5" text-anchor="start" fill="#6b7d83">inventory</text>
<line x1="390" y1="232" x2="426" y2="232" stroke="#0e6e58" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#a-commit)"/>
<rect x="590" y="180" width="148" height="76" fill="#ffffff" stroke="#17323b" stroke-width="1.1"/>
<text x="664.0" y="200" font-size="13" text-anchor="middle" fill="#17323b" font-weight="600">payment</text>
<text x="664.0" y="218" font-size="11" text-anchor="middle" fill="#6b7d83">asks the provider</text>
<path d="M602,235.5 v7 a5,3.5 0 0 0 10,0 v-7" fill="none" stroke="#17323b" stroke-width="1"/>
<ellipse cx="607" cy="235.5" rx="5" ry="3.5" fill="none" stroke="#17323b" stroke-width="1"/>
<text x="616" y="243" font-size="10.5" text-anchor="start" fill="#6b7d83">payments</text>
<polyline points="574,204 582,204 582,218 590,218" fill="none" stroke="#0e6e58" stroke-width="1.1" marker-end="url(#a-commit)"/>
<text x="500" y="172" font-size="10" text-anchor="middle" fill="#6b7d83">task token out, answer back</text>
<rect x="754" y="180" width="102" height="76" fill="#eef3f2" stroke="#17323b" stroke-width="1.1"/>
<text x="805.0" y="200" font-size="13" text-anchor="middle" fill="#17323b" font-weight="600">catalogue</text>
<text x="805.0" y="218" font-size="11" text-anchor="middle" fill="#6b7d83">products,</text>
<text x="805.0" y="233" font-size="11" text-anchor="middle" fill="#6b7d83">prices</text>
<polyline points="584,103 805,103 805,176" fill="none" stroke="#9fb0b5" stroke-width="1.1" marker-end="url(#a-rule)"/>
<line x1="24" y1="330" x2="856" y2="330" stroke="#17323b" stroke-width="3"/>
<circle cx="24" cy="330" r="3.5" fill="#17323b"/>
<circle cx="856" cy="330" r="3.5" fill="#17323b"/>
<text x="24" y="314" font-size="13" text-anchor="start" fill="#17323b" font-weight="600">maltashop-bus</text>
<text x="856" y="314" font-size="11" text-anchor="end" fill="#6b7d83">one rule per consumer</text>
<line x1="140" y1="258" x2="140" y2="326" stroke="#0e6e58" stroke-width="1.1" marker-end="url(#a-commit)"/>
<circle cx="140" cy="330" r="3.2" fill="#17323b"/>
<line x1="310" y1="258" x2="310" y2="326" stroke="#0e6e58" stroke-width="1.1" marker-end="url(#a-commit)"/>
<circle cx="310" cy="330" r="3.2" fill="#17323b"/>
<line x1="500" y1="258" x2="500" y2="326" stroke="#17323b" stroke-width="1.1" marker-end="url(#a-ink)"/>
<circle cx="500" cy="330" r="3.2" fill="#17323b"/>
<line x1="664" y1="258" x2="664" y2="326" stroke="#17323b" stroke-width="1.1" marker-end="url(#a-ink)"/>
<circle cx="664" cy="330" r="3.2" fill="#17323b"/>
<line x1="122" y1="334" x2="122" y2="392" stroke="#17323b" stroke-width="1.1" marker-end="url(#a-ink)"/>
<rect x="24" y="396" width="196" height="72" fill="#ffffff" stroke="#17323b" stroke-width="1.1"/>
<text x="122.0" y="416" font-size="13" text-anchor="middle" fill="#17323b" font-weight="600">projector</text>
<text x="122.0" y="434" font-size="11" text-anchor="middle" fill="#6b7d83">folds the stream into</text>
<text x="122.0" y="449" font-size="11" text-anchor="middle" fill="#6b7d83">the order read model</text>
<line x1="334" y1="334" x2="334" y2="392" stroke="#17323b" stroke-width="1.1" marker-end="url(#a-ink)"/>
<rect x="236" y="396" width="196" height="72" fill="#ffffff" stroke="#17323b" stroke-width="1.1"/>
<text x="334.0" y="416" font-size="13" text-anchor="middle" fill="#17323b" font-weight="600">notification</text>
<text x="334.0" y="434" font-size="11" text-anchor="middle" fill="#6b7d83">e-mail and SMS;</text>
<text x="334.0" y="449" font-size="11" text-anchor="middle" fill="#6b7d83">nothing waits for it</text>
<line x1="546" y1="334" x2="546" y2="392" stroke="#17323b" stroke-width="1.1" marker-end="url(#a-ink)"/>
<rect x="448" y="396" width="196" height="72" fill="#ffffff" stroke="#17323b" stroke-width="1.1"/>
<text x="546.0" y="416" font-size="13" text-anchor="middle" fill="#17323b" font-weight="600">recommendation</text>
<text x="546.0" y="434" font-size="11" text-anchor="middle" fill="#6b7d83">reads the same stream,</text>
<text x="546.0" y="449" font-size="11" text-anchor="middle" fill="#6b7d83">never the till</text>
<line x1="758" y1="334" x2="758" y2="392" stroke="#17323b" stroke-width="1.1" marker-end="url(#a-ink)"/>
<rect x="660" y="396" width="196" height="72" fill="#ffffff" stroke="#17323b" stroke-width="1.1"/>
<text x="758.0" y="416" font-size="13" text-anchor="middle" fill="#17323b" font-weight="600">partner feed</text>
<text x="758.0" y="434" font-size="11" text-anchor="middle" fill="#6b7d83">one queue per retailer,</text>
<text x="758.0" y="449" font-size="11" text-anchor="middle" fill="#6b7d83">added without a release</text>
<line x1="24" y1="512" x2="856" y2="512" stroke="#9fb0b5" stroke-width="0.9"/>
<text x="440" y="534" font-size="11.5" text-anchor="middle" fill="#6b7d83" font-style="italic">Nothing above is a server. Every box is a function invoked on demand, a managed service or a table,</text>
<text x="440" y="552" font-size="11.5" text-anchor="middle" fill="#6b7d83" font-style="italic">so capacity during a sale is not a decision anybody makes.</text>
<text x="440" y="576" font-size="10.5" text-anchor="middle" fill="#6b7d83">Solid line, a call. Dashed line, a message. Green, the path that commits.</text>
</svg>
