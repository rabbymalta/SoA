<line x1="440" y1="80" x2="440" y2="128" stroke="#6b6a70" stroke-width="1.0" marker-end="url(#arrow-grey)"/>
<line x1="740" y1="80" x2="740" y2="128" stroke="#6b6a70" stroke-width="1.0" marker-end="url(#arrow-grey)"/>
