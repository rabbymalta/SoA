<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1c1b1f"/></marker><marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#6b6a70"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#b45309"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#8a6d1f"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#4338ca"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#15635a"/></marker></defs>
<rect width="880" height="560" fill="white"/>
<rect x="0" y="0" width="880" height="560" rx="3" fill="#ffffff" stroke="#ffffff" stroke-width="0"/>
<text x="440" y="26" font-size="12" text-anchor="middle" fill="#6b6a70" font-style="italic">The saga is a declaration. This diagram and contracts/place-order.asl.json are the same thing.</text>
<text x="24" y="56" font-size="11" text-anchor="start" fill="#6b6a70" font-weight="bold">THE DECLARED STATES</text>
<rect x="24" y="68" width="180" height="66" rx="3" fill="#ffffff" stroke="#1c1b1f" stroke-width="1.0"/>
<text x="114.0" y="89" font-size="12.5" text-anchor="middle" fill="#1c1b1f" font-weight="bold">ReserveStock</text>
<text x="114.0" y="107" font-size="10.5" text-anchor="middle" fill="#1c1b1f">sqs:sendMessage</text>
<text x="114.0" y="121" font-size="10.5" text-anchor="middle" fill="#1c1b1f">.waitForTaskToken</text>
<rect x="236" y="68" width="136" height="66" rx="3" fill="#eeedfb" stroke="#4338ca" stroke-width="1.4"/>
<text x="304.0" y="89" font-size="12.5" text-anchor="middle" fill="#4338ca" font-weight="bold">StockOutcome</text>
<text x="304.0" y="107" font-size="10.5" text-anchor="middle" fill="#1c1b1f">Choice on</text>
<text x="304.0" y="121" font-size="10.5" text-anchor="middle" fill="#1c1b1f">$.stock.status</text>
<rect x="404" y="68" width="180" height="66" rx="3" fill="#ffffff" stroke="#1c1b1f" stroke-width="1.0"/>
<text x="494.0" y="89" font-size="12.5" text-anchor="middle" fill="#1c1b1f" font-weight="bold">AuthorisePayment</text>
<text x="494.0" y="107" font-size="10.5" text-anchor="middle" fill="#1c1b1f">sqs:sendMessage</text>
<text x="494.0" y="121" font-size="10.5" text-anchor="middle" fill="#1c1b1f">.waitForTaskToken</text>
<rect x="616" y="68" width="136" height="66" rx="3" fill="#eeedfb" stroke="#4338ca" stroke-width="1.4"/>
<text x="684.0" y="89" font-size="12.5" text-anchor="middle" fill="#4338ca" font-weight="bold">PaymentOutcome</text>
<text x="684.0" y="107" font-size="10.5" text-anchor="middle" fill="#1c1b1f">Choice on</text>
<text x="684.0" y="121" font-size="10.5" text-anchor="middle" fill="#1c1b1f">$.payment.status</text>
<line x1="204" y1="101" x2="234" y2="101" stroke="#1c1b1f" stroke-width="1.2" marker-end="url(#arrow-ink)"/>
<line x1="372" y1="101" x2="402" y2="101" stroke="#1c1b1f" stroke-width="1.2" marker-end="url(#arrow-ink)"/>
<line x1="584" y1="101" x2="614" y2="101" stroke="#1c1b1f" stroke-width="1.2" marker-end="url(#arrow-ink)"/>
<rect x="676" y="176" width="180" height="62" rx="3" fill="#e7f2f0" stroke="#15635a" stroke-width="1.4"/>
<text x="766.0" y="197" font-size="12.5" text-anchor="middle" fill="#15635a" font-weight="bold">ConfirmOrder</text>
<text x="766.0" y="215" font-size="10.5" text-anchor="middle" fill="#1c1b1f">events:putEvents</text>
<text x="766.0" y="229" font-size="10.5" text-anchor="middle" fill="#1c1b1f">End</text>
<polyline points="684,101 780,101 780,174" fill="none" stroke="#1c1b1f" stroke-width="1.2" marker-end="url(#arrow-ink)"/>
<text x="800" y="128" font-size="10" text-anchor="middle" fill="#15635a">AUTHORISED</text>
<rect x="404" y="176" width="180" height="62" rx="3" fill="#fdf1e3" stroke="#b45309" stroke-width="1.4"/>
<text x="494.0" y="197" font-size="12.5" text-anchor="middle" fill="#b45309" font-weight="bold">ReleaseStock</text>
<text x="494.0" y="215" font-size="10.5" text-anchor="middle" fill="#1c1b1f">the compensating state</text>
<text x="494.0" y="229" font-size="10.5" text-anchor="middle" fill="#1c1b1f">waitForTaskToken</text>
<polyline points="684,134 684,155 494,155 494,174" fill="none" stroke="#b45309" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<text x="560" y="150" font-size="10" text-anchor="middle" fill="#b45309">DECLINED</text>
<rect x="404" y="262" width="180" height="56" rx="3" fill="#fdf1e3" stroke="#b45309" stroke-width="1.4"/>
<text x="494.0" y="283" font-size="12.5" text-anchor="middle" fill="#b45309" font-weight="bold">CancelOrder</text>
<text x="494.0" y="301" font-size="10.5" text-anchor="middle" fill="#1c1b1f">events:putEvents · End</text>
<line x1="494" y1="238" x2="494" y2="260" stroke="#b45309" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<rect x="136" y="176" width="180" height="62" rx="3" fill="#fdf1e3" stroke="#b45309" stroke-width="1.4"/>
<text x="226.0" y="197" font-size="12.5" text-anchor="middle" fill="#b45309" font-weight="bold">RejectOrder</text>
<text x="226.0" y="215" font-size="10.5" text-anchor="middle" fill="#1c1b1f">events:putEvents</text>
<text x="226.0" y="229" font-size="10.5" text-anchor="middle" fill="#1c1b1f">End</text>
<polyline points="304,134 304,155 226,155 226,174" fill="none" stroke="#b45309" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<text x="272" y="150" font-size="10" text-anchor="middle" fill="#b45309">REJECTED</text>
<line x1="24" y1="342" x2="856" y2="342" stroke="#6b6a70" stroke-width="0.8"/>
<text x="24" y="366" font-size="11" text-anchor="start" fill="#6b6a70" font-weight="bold">THE TASK-TOKEN PROTOCOL, WHICH IS WHAT LETS A CONTAINER DO THE WORK</text>
<rect x="24" y="378" width="404" height="110" rx="3" fill="#ffffff" stroke="#1c1b1f" stroke-width="1.0"/>
<text x="226" y="400" font-size="11" text-anchor="middle" fill="#1c1b1f">1  the state sends a message carrying an opaque token</text>
<text x="226" y="416" font-size="11" text-anchor="middle" fill="#1c1b1f">2  the worker does its own local transaction</text>
<text x="226" y="432" font-size="11" text-anchor="middle" fill="#1c1b1f">3  the worker calls SendTaskSuccess with that token</text>
<text x="226" y="448" font-size="11" text-anchor="middle" fill="#1c1b1f">4  the workflow writes the output at ResultPath</text>
<text x="226" y="464" font-size="11" text-anchor="middle" fill="#1c1b1f">5  the Choice reads it and picks the next state</text>
<rect x="452" y="378" width="404" height="110" rx="3" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/>
<text x="654" y="400" font-size="13" text-anchor="middle" fill="#b45309" font-weight="bold">no worker knows the sequence</text>
<text x="654" y="419" font-size="11" text-anchor="middle" fill="#1c1b1f">Inventory has never heard of Payment. Neither knows</text>
<text x="654" y="435" font-size="11" text-anchor="middle" fill="#1c1b1f">what happens after it answers. The order of the steps</text>
<text x="654" y="451" font-size="11" text-anchor="middle" fill="#1c1b1f">is in one file, reviewed as one change, and visible as</text>
<text x="654" y="467" font-size="11" text-anchor="middle" fill="#1c1b1f">one execution in the console.</text>
<text x="440" y="516" font-size="11" text-anchor="middle" fill="#6b6a70" font-style="italic">Every waiting state carries TimeoutSeconds and a Catch, so a worker that never answers ends the saga rather than</text>
<text x="440" y="534" font-size="11" text-anchor="middle" fill="#6b6a70" font-style="italic">leaving it open. Nothing is rolled back: ReleaseStock is an ordinary, idempotent operation.</text>
</svg>
