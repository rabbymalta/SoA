<svg xmlns="http://www.w3.org/2000/svg" width="880" height="572" viewBox="0 0 880 572" font-family="Optima, Palatino, serif">
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5 z" fill="#17323b"/></marker><marker id="a-rule" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5 z" fill="#9fb0b5"/></marker><marker id="a-quiet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5 z" fill="#6b7d83"/></marker><marker id="a-commit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5 z" fill="#0e6e58"/></marker><marker id="a-undo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5 z" fill="#8c2f22"/></marker></defs>
<rect width="880" height="572" fill="white"/>
<text x="24" y="28" font-size="13.5" text-anchor="start" fill="#17323b" font-weight="600">What the file declares</text>
<rect x="24" y="46" width="150" height="56" fill="#ffffff" stroke="#17323b" stroke-width="1.1"/>
<text x="99.0" y="66" font-size="13" text-anchor="middle" fill="#17323b" font-weight="600">ReserveStock</text>
<text x="99.0" y="84" font-size="11" text-anchor="middle" fill="#6b7d83">waits for a worker</text>
<rect x="196" y="46" width="136" height="56" fill="#ffffff" stroke="#17323b" stroke-width="1.1"/>
<text x="264.0" y="66" font-size="13" text-anchor="middle" fill="#17323b" font-weight="600">StockOutcome</text>
<text x="264.0" y="84" font-size="11" text-anchor="middle" fill="#6b7d83">reads the answer</text>
<rect x="352" y="46" width="150" height="56" fill="#ffffff" stroke="#17323b" stroke-width="1.1"/>
<text x="427.0" y="66" font-size="13" text-anchor="middle" fill="#17323b" font-weight="600">AuthorisePayment</text>
<text x="427.0" y="84" font-size="11" text-anchor="middle" fill="#6b7d83">waits for a worker</text>
<rect x="544" y="46" width="136" height="56" fill="#ffffff" stroke="#17323b" stroke-width="1.1"/>
<text x="612.0" y="66" font-size="13" text-anchor="middle" fill="#17323b" font-weight="600">PaymentOutcome</text>
<text x="612.0" y="84" font-size="11" text-anchor="middle" fill="#6b7d83">reads the answer</text>
<line x1="174" y1="74" x2="192" y2="74" stroke="#17323b" stroke-width="1.1" marker-end="url(#a-ink)"/>
<line x1="332" y1="74" x2="348" y2="74" stroke="#17323b" stroke-width="1.1" marker-end="url(#a-ink)"/>
<line x1="502" y1="74" x2="540" y2="74" stroke="#17323b" stroke-width="1.1" marker-end="url(#a-ink)"/>
<rect x="700" y="46" width="156" height="56" fill="#ffffff" stroke="#0e6e58" stroke-width="1.5"/>
<text x="778.0" y="66" font-size="13" text-anchor="middle" fill="#0e6e58" font-weight="600">ConfirmOrder</text>
<text x="778.0" y="84" font-size="11" text-anchor="middle" fill="#6b7d83">publishes, and ends</text>
<line x1="680" y1="74" x2="696" y2="74" stroke="#0e6e58" stroke-width="1.1" marker-end="url(#a-commit)"/>
<rect x="352" y="136" width="150" height="56" fill="#ffffff" stroke="#8c2f22" stroke-width="1.5"/>
<text x="427.0" y="156" font-size="13" text-anchor="middle" fill="#8c2f22" font-weight="600">ReleaseStock</text>
<text x="427.0" y="174" font-size="11" text-anchor="middle" fill="#6b7d83">hands the hold back</text>
<polyline points="612,102 612,118 427,118 427,132" fill="none" stroke="#8c2f22" stroke-width="1.1" marker-end="url(#a-undo)"/>
<text x="520" y="113" font-size="10.5" text-anchor="middle" fill="#8c2f22">declined</text>
<rect x="352" y="212" width="150" height="44" fill="#ffffff" stroke="#8c2f22" stroke-width="1.5"/>
<text x="427.0" y="232" font-size="13" text-anchor="middle" fill="#8c2f22" font-weight="600">CancelOrder</text>
<line x1="427" y1="192" x2="427" y2="208" stroke="#8c2f22" stroke-width="1.1" marker-end="url(#a-undo)"/>
<rect x="24" y="136" width="150" height="56" fill="#ffffff" stroke="#8c2f22" stroke-width="1.5"/>
<text x="99.0" y="156" font-size="13" text-anchor="middle" fill="#8c2f22" font-weight="600">RejectOrder</text>
<text x="99.0" y="174" font-size="11" text-anchor="middle" fill="#6b7d83">nothing was held</text>
<polyline points="264,102 264,118 99,118 99,132" fill="none" stroke="#8c2f22" stroke-width="1.1" marker-end="url(#a-undo)"/>
<text x="182" y="113" font-size="10.5" text-anchor="middle" fill="#8c2f22">no stock</text>
<line x1="24" y1="292" x2="856" y2="292" stroke="#9fb0b5" stroke-width="0.9"/>
<text x="24" y="320" font-size="12.5" text-anchor="start" fill="#17323b" font-weight="600">How a worker is asked</text>
<text x="24" y="344" font-size="11.5" text-anchor="start" fill="#17323b">Two Task states wait on a worker. The workflow hands out an</text>
<text x="24" y="363" font-size="11.5" text-anchor="start" fill="#17323b">opaque token and does nothing until the worker returns it, so</text>
<text x="24" y="382" font-size="11.5" text-anchor="start" fill="#17323b">Inventory has never heard of Payment and neither knows what</text>
<text x="24" y="401" font-size="11.5" text-anchor="start" fill="#17323b">follows its answer.</text>
<text x="24" y="420" font-size="11.5" text-anchor="start" fill="#17323b"></text>
<text x="24" y="439" font-size="11.5" text-anchor="start" fill="#17323b">Every waiting state carries a timeout and a catch, so a worker</text>
<text x="24" y="458" font-size="11.5" text-anchor="start" fill="#17323b">that never answers ends the saga rather than leaving it open.</text>
<line x1="528" y1="300" x2="528" y2="500" stroke="#9fb0b5" stroke-width="0.9"/>
<text x="560" y="320" font-size="12.5" text-anchor="start" fill="#17323b" font-weight="600">What one order's stream recorded</text>
<line x1="576" y1="338" x2="576" y2="492" stroke="#9fb0b5" stroke-width="0.9"/>
<circle cx="576" cy="350" r="9" fill="#ffffff" stroke="#17323b" stroke-width="1.2"/>
<text x="576" y="354" font-size="11" text-anchor="middle" fill="#17323b" font-weight="600">1</text>
<text x="594" y="354" font-size="12.5" text-anchor="start" fill="#17323b">OrderPlaced</text>
<text x="594" y="369" font-size="10.5" text-anchor="start" fill="#6b7d83">written with the order, in one transaction</text>
<circle cx="576" cy="388" r="9" fill="#ffffff" stroke="#17323b" stroke-width="1.2"/>
<text x="576" y="392" font-size="11" text-anchor="middle" fill="#17323b" font-weight="600">2</text>
<text x="594" y="392" font-size="12.5" text-anchor="start" fill="#17323b">StockReserved</text>
<text x="594" y="407" font-size="10.5" text-anchor="start" fill="#6b7d83">the hold, published by Inventory</text>
<circle cx="576" cy="426" r="9" fill="#ffffff" stroke="#17323b" stroke-width="1.2"/>
<text x="576" y="430" font-size="11" text-anchor="middle" fill="#17323b" font-weight="600">3</text>
<text x="594" y="430" font-size="12.5" text-anchor="start" fill="#17323b">PaymentAuthorised</text>
<text x="594" y="445" font-size="10.5" text-anchor="start" fill="#6b7d83">the provider's reference</text>
<circle cx="576" cy="464" r="9" fill="#ffffff" stroke="#0e6e58" stroke-width="1.2"/>
<text x="576" y="468" font-size="11" text-anchor="middle" fill="#0e6e58" font-weight="600">4</text>
<text x="594" y="468" font-size="12.5" text-anchor="start" fill="#17323b">OrderConfirmed</text>
<text x="594" y="483" font-size="10.5" text-anchor="start" fill="#6b7d83">the workflow's last state</text>
<line x1="24" y1="522" x2="856" y2="522" stroke="#9fb0b5" stroke-width="0.9"/>
<text x="24" y="548" font-size="11" text-anchor="start" fill="#6b7d83" font-style="italic">Nothing is rolled back. ReleaseStock is an ordinary operation, safe to run twice and safe when nothing was held.</text>
</svg>
